<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Sepak Bola 2D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e293b;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    h1 {
      margin-bottom: 5px;
      color: #4ade80;
      font-size: 24px;
    }

    .scoreboard {
      display: flex;
      gap: 20px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      background: #0f172a;
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    canvas {
      background-color: #15803d; /* Warna Lapangan Hijau */
      border: 4px solid white;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Kontrol Layar HP */
    .controls {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      gap: 5px;
    }

    .btn-ctrl {
      background-color: #334155;
      color: white;
      border: 1px solid #475569;
      font-size: 18px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .btn-ctrl:active {
      background-color: #22c55e;
    }

    .empty { visibility: hidden; }

    p.info {
      margin-top: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>⚽ Game Sepak Bola 2D</h1>
  
  <div class="scoreboard">
    <div>Skor: <span id="score">0</span></div>
    <div>Waktu: <span id="timer">60</span>s</div>
  </div>

  <canvas id="field" width="360" height="460"></canvas>

  <!-- Kontrol Tombol untuk HP -->
  <div class="controls">
    <div class="empty"></div>
    <button class="btn-ctrl" onmousedown="move('UP')" onmouseup="stop()" ontouchstart="move('UP')" ontouchend="stop()">⬆️</button>
    <div class="empty"></div>
    <button class="btn-ctrl" onmousedown="move('LEFT')" onmouseup="stop()" ontouchstart="move('LEFT')" ontouchend="stop()">⬅️</button>
    <button class="btn-ctrl" onmousedown="move('DOWN')" onmouseup="stop()" ontouchstart="move('DOWN')" ontouchend="stop()">⬇️</button>
    <button class="btn-ctrl" onmousedown="move('RIGHT')" onmouseup="stop()" ontouchstart="move('RIGHT')" ontouchend="stop()">➡️</button>
  </div>

  <p class="info">Gunakan panah keyboard atau tombol di layar untuk merebut bola & cetak gol!</p>

  <script>
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let timeLeft = 60;
    let gameOver = false;

    // Objek Pemain
    const player = {
      x: 180,
      y: 380,
      radius: 12,
      color: "#3b82f6", // Biru
      speed: 3,
      dx: 0,
      dy: 0
    };

    // Objek Kiper Musuh
    const enemy = {
      x: 180,
      y: 50,
      radius: 12,
      color: "#ef4444", // Merah
      speed: 1.8,
      dir: 1
    };

    // Objek Bola
    const ball = {
      x: 180,
      y: 230,
      radius: 8,
      color: "#ffffff",
      vx: 0,
      vy: 0,
      friction: 0.96
    };

    // Area Gawang Atas (Musuh)
    const goal = { x: 110, y: 0, width: 140, height: 10 };

    // Kontrol Keyboard
    const keys = {};
    window.addEventListener("keydown", e => keys[e.key] = true);
    window.addEventListener("keyup", e => keys[e.key] = false);

    function move(dir) {
      if (dir === 'UP') player.dy = -player.speed;
      if (dir === 'DOWN') player.dy = player.speed;
      if (dir === 'LEFT') player.dx = -player.speed;
      if (dir === 'RIGHT') player.dx = player.speed;
    }

    function stop() {
      player.dx = 0;
      player.dy = 0;
    }

    // Timer Game
    const timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        document.getElementById("timer").innerText = timeLeft;
      } else {
        gameOver = true;
        clearInterval(timerInterval);
        alert("WAKTU HABIS! Total Gol Kamu: " + score);
        location.reload();
      }
    }, 1000);

    function resetPositions() {
      player.x = 180;
      player.y = 380;
      ball.x = 180;
      ball.y = 230;
      ball.vx = 0;
      ball.vy = 0;
      enemy.x = 180;
    }

    function update() {
      if (gameOver) return;

      // Gerakan Pemain dari Keyboard
      if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
      if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;
      if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
      if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;

      // Gerakan dari Tombol Layar
      player.x += player.dx;
      player.y += player.dy;

      // Batasi Pemain di dalam Lapangan
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      // Gerakan Kiper Musuh (Bolak-balik di depan gawang)
      enemy.x += enemy.speed * enemy.dir;
      if (enemy.x > goal.x + goal.width - enemy.radius || enemy.x < goal.x + enemy.radius) {
        enemy.dir *= -1;
      }

      // Fisika Bola (Pergerakan & Gesekan)
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.vx *= ball.friction;
      ball.vy *= ball.friction;

      // Pantulan Bola di Dinding Lapangan
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) ball.vx *= -1;
      if (ball.y + ball.radius > canvas.height) ball.vy *= -1;

      // Deteksi TENDANGAN (Pemain menyentuh bola)
      let dx = ball.x - player.x;
      let dy = ball.y - player.y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < player.radius + ball.radius) {
        let angle = Math.atan2(dy, dx);
        let force = 6; // Kekuatan tendangan
        ball.vx = Math.cos(angle) * force;
        ball.vy = Math.sin(angle) * force;
      }

      // Deteksi KIPER MENANGKAP BOLA
      let edx = ball.x - enemy.x;
      let edy = ball.y - enemy.y;
      let edist = Math.sqrt(edx * edx + edy * edy);

      if (edist < enemy.radius + ball.radius) {
        ball.vx *= -1.2;
        ball.vy *= -1.2;
      }

      // Deteksi GOL!
      if (
        ball.x > goal.x && 
        ball.x < goal.x + goal.width && 
        ball.y - ball.radius <= goal.height
      ) {
        score++;
        document.getElementById("score").innerText = score;
        alert("GOOOOL!! ⚽🎉");
        resetPositions();
      }
    }

    function draw() {
      // Gambar Lapangan
      ctx.fillStyle = "#15803d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Garis Tengah & Lingkaran Lapangan
      ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 40, 0, Math.PI * 2);
      ctx.stroke();

      // Gambar Gawang
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

      // Gambar Pemain (Biru)
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Gambar Kiper Musuh (Merah)
      ctx.fillStyle = enemy.color;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
      ctx.fill();

      // Gambar Bola
      ctx.fillStyle = ball.color;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>

</body>
</html>
