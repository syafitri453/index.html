<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    h1 {
      margin-bottom: 5px;
      color: #facc15;
      font-size: 26px;
    }

    .score-container {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      background: #1e293b;
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    canvas {
      background-color: #70c5ce; /* Warna Langit */
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    p.info {
      margin-top: 10px;
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🐤 Flappy Bird</h1>
  <div class="score-container">Skor: <span id="score">0</span></div>

  <canvas id="gameCanvas" width="320" height="480"></canvas>

  <p class="info">Tekan <b>Spasi</b>, <b>Klik Mouse</b>, atau <b>Ketuk Layar HP</b> untuk terbang!</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    // Variabel Burung
    const bird = {
      x: 50,
      y: 150,
      radius: 12,
      gravity: 0.25,
      jump: -4.6,
      velocity: 0
    };

    // Variabel Pipa & Game
    let pipes = [];
    let frame = 0;
    let score = 0;
    let gameOver = false;
    const pipeWidth = 52;
    const pipeGap = 120;

    // Kontrol Lompat (Keyboard & Sentuhan)
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") jump();
    });
    canvas.addEventListener("click", jump);
    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      jump();
    });

    function jump() {
      if (gameOver) {
        resetGame();
      } else {
        bird.velocity = bird.jump;
      }
    }

    function resetGame() {
      bird.y = 150;
      bird.velocity = 0;
      pipes = [];
      score = 0;
      frame = 0;
      gameOver = false;
      scoreElement.innerText = score;
      gameLoop();
    }

    function update() {
      if (gameOver) return;

      // Fisika Gravitasi Burung
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // Batas Atas dan Bawah Layar
      if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
        endGame();
      }

      // Generasi Pipa Baru Setiap 100 Frame
      if (frame % 100 === 0) {
        const topPipeHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 100)) + 30;
        pipes.push({
          x: canvas.width,
          top: topPipeHeight,
          passed: false
        });
      }

      // Pergerakan & Deteksi Tabrakan Pipa
      for (let i = 0; i < pipes.length; i++) {
        let p = pipes[i];
        p.x -= 2; // Kecepatan Pipa Bergerak ke Kiri

        // Deteksi Tabrakan dengan Burung
        if (
          bird.x + bird.radius > p.x &&
          bird.x - bird.radius < p.x + pipeWidth &&
          (bird.y - bird.radius < p.top || bird.y + bird.radius > p.top + pipeGap)
        ) {
          endGame();
        }

        // Tambah Skor Saat Melewati Pipa
        if (p.x + pipeWidth < bird.x && !p.passed) {
          score++;
          p.passed = true;
          scoreElement.innerText = score;
        }
      }

      // Hapus Pipa yang Sudah Keluar Layar
      if (pipes.length > 0 && pipes[0].x < -pipeWidth) {
        pipes.shift();
      }

      frame++;
    }

    function draw() {
      // Background Latar Langit
      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gambar Pipa Hijau
      for (let i = 0; i < pipes.length; i++) {
        let p = pipes[i];

        ctx.fillStyle = "#22c55e"; // Pipa Hijau
        ctx.strokeStyle = "#15803d";
        ctx.lineWidth = 2;

        // Pipa Atas
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.strokeRect(p.x, 0, pipeWidth, p.top);

        // Pipa Bawah
        const bottomPipeY = p.top + pipeGap;
        const bottomPipeHeight = canvas.height - bottomPipeY;
        ctx.fillRect(p.x, bottomPipeY, pipeWidth, bottomPipeHeight);
        ctx.strokeRect(p.x, bottomPipeY, pipeWidth, bottomPipeHeight);
      }

      // Gambar Burung (Kuning)
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#eab308";
      ctx.stroke();

      // Gambar Mata Burung
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(bird.x + 5, bird.y - 3, 2, 0, Math.PI * 2);
      ctx.fill();

      // Tampilan Layar Game Over
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = "16px sans-serif";
        ctx.fillText("Klik / Ketuk untuk Ulangi", canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function endGame() {
      gameOver = true;
    }

    function gameLoop() {
      update();
      draw();
      if (!gameOver) {
        requestAnimationFrame(gameLoop);
      }
    }

    gameLoop();
  </script>

</body>
</html>
