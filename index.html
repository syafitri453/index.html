<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Block Blast</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 5px;
      font-size: 26px;
    }

    .score-container {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      background-color: #1e293b;
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    /* Papan Game 8x8 */
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 4px;
      background-color: #1e293b;
      padding: 8px;
      border-radius: 10px;
      width: 320px;
      height: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .cell {
      background-color: #334155;
      border-radius: 4px;
      cursor: pointer;
    }

    .cell.filled {
      background-color: #38bdf8;
      box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.5);
    }

    /* Pilihan Balok di Bawah */
    #shapes-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 320px;
      margin-top: 20px;
      min-height: 90px;
      background-color: #1e293b;
      border-radius: 10px;
      padding: 10px;
    }

    .shape-preview {
      display: grid;
      gap: 2px;
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .shape-preview.selected {
      border-color: #f43f5e;
      background-color: #0f172a;
    }

    .shape-cell {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }

    .shape-cell.active {
      background-color: #f43f5e;
    }

    p.info {
      margin-top: 15px;
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🧩 Block Blast</h1>
  <div class="score-container">Skor: <span id="score">0</span></div>

  <!-- Area Papan Game 8x8 -->
  <div id="board"></div>

  <!-- Pilihan 3 Balok -->
  <div id="shapes-container"></div>

  <p class="info">Pilih balok di bawah, lalu klik kotak di papan untuk memasangnya!</p>

  <script>
    const BOARD_SIZE = 8;
    const boardElement = document.getElementById("board");
    const shapesContainer = document.getElementById("shapes-container");
    const scoreElement = document.getElementById("score");

    let grid = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
    let score = 0;
    let selectedShapeIndex = null;
    let currentShapes = [];

    // Bentuk-bentuk balok (1-4 kotak)
    const SHAPES = [
      [[1]], // 1x1
      [[1, 1]], // 1x2 horizontal
      [[1], [1]], // 2x1 vertikal
      [[1, 1, 1]], // 1x3 horizontal
      [[1], [1], [1]], // 3x1 vertikal
      [[1, 1], [1, 1]], // 2x2 kotak
      [[1, 1, 1], [0, 1, 0]], // T-shape
      [[1, 1], [1, 0]], // L-shape
    ];

    // Inisialisasi Papan
    function createBoard() {
      boardElement.innerHTML = "";
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.addEventListener("click", () => placeShape(r, c));
          boardElement.appendChild(cell);
        }
      }
    }

    // Render Ulang Papan Game
    function updateBoard() {
      const cells = boardElement.children;
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const index = r * BOARD_SIZE + c;
          if (grid[r][c] === 1) {
            cells[index].classList.add("filled");
          } else {
            cells[index].classList.remove("filled");
          }
        }
      }
    }

    // Buat 3 Balok Acak
    function generateShapes() {
      currentShapes = [];
      shapesContainer.innerHTML = "";
      selectedShapeIndex = null;

      for (let i = 0; i < 3; i++) {
        const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        currentShapes.push(randomShape);

        const shapePreview = document.createElement("div");
        shapePreview.classList.add("shape-preview");
        shapePreview.style.gridTemplateColumns = `repeat(${randomShape[0].length}, 16px)`;

        randomShape.forEach(row => {
          row.forEach(val => {
            const cell = document.createElement("div");
            cell.classList.add("shape-cell");
            if (val === 1) cell.classList.add("active");
            shapePreview.appendChild(cell);
          });
        });

        shapePreview.addEventListener("click", () => selectShape(i, shapePreview));
        shapesContainer.appendChild(shapePreview);
      }
    }

    function selectShape(index, element) {
      if (!currentShapes[index]) return;
      
      const previews = document.querySelectorAll(".shape-preview");
      previews.forEach(p => p.classList.remove("selected"));

      selectedShapeIndex = index;
      element.classList.add("selected");
    }

    // Pasang Balok ke Papan
    function placeShape(r, c) {
      if (selectedShapeIndex === null) return;

      const shape = currentShapes[selectedShapeIndex];
      if (!canPlaceShape(shape, r, c)) return;

      // Isi grid dengan balok
      for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
          if (shape[row][col] === 1) {
            grid[r + row][c + col] = 1;
          }
        }
      }

      // Hapus pilihan balok yang baru dipakai
      currentShapes[selectedShapeIndex] = null;
      shapesContainer.children[selectedShapeIndex].style.visibility = "hidden";
      selectedShapeIndex = null;

      score += 10;
      updateBoard();
      checkClearLines();

      // Jika 3 balok sudah habis dipakai, buat 3 baru lagi
      if (currentShapes.every(s => s === null)) {
        generateShapes();
      }
    }

    function canPlaceShape(shape, r, c) {
      for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
          if (shape[row][col] === 1) {
            let targetR = r + row;
            let targetC = c + col;

            if (
              targetR >= BOARD_SIZE ||
              targetC >= BOARD_SIZE ||
              grid[targetR][targetC] === 1
            ) {
              return false;
            }
          }
        }
      }
      return true;
    }

    // Cek dan Hancurkan Baris / Kolom Penuh
    function checkClearLines() {
      let rowsToClear = [];
      let colsToClear = [];

      // Cek Baris Penuh
      for (let r = 0; r < BOARD_SIZE; r++) {
        if (grid[r].every(val => val === 1)) {
          rowsToClear.push(r);
        }
      }

      // Cek Kolom Penuh
      for (let c = 0; c < BOARD_SIZE; c++) {
        let full = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
          if (grid[r][c] === 0) full = false;
        }
        if (full) colsToClear.push(c);
      }

      // Hapus Baris
      rowsToClear.forEach(r => {
        for (let c = 0; c < BOARD_SIZE; c++) grid[r][c] = 0;
      });

      // Hapus Kolom
      colsToClear.forEach(c => {
        for (let r = 0; r < BOARD_SIZE; r++) grid[r][c] = 0;
      });

      let cleared = rowsToClear.length + colsToClear.length;
      if (cleared > 0) {
        score += cleared * 100;
        scoreElement.innerText = score;
        updateBoard();
      }
    }

    // Mulai Game
    createBoard();
    generateShapes();
  </script>

</body>
</html>
